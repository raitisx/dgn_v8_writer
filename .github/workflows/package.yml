name: Package

# Builds the dgnv8w bundle (program, docs, examples, inspection scripts) for
# Windows, Linux, macOS and FreeBSD. Every run keeps the bundles as workflow
# artifacts; a pushed tag v* also attaches them to a GitHub release.
# GitHub has no FreeBSD runners, so that bundle is built and tested inside a
# FreeBSD virtual machine on a Linux runner.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cargo test

      - name: Bundle
        run: tools/package.sh

      - name: Bundle runs its example
        run: |
          cd dist/dgnv8w-*/
          ./dgnv8w build examples/gdal_example.json

      - uses: actions/upload-artifact@v4
        with:
          name: dgnv8w-${{ matrix.os }}
          path: dist/*.tar.gz
          retention-days: 30

  bundle-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test and bundle in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust bash git
            git config --global --add safe.directory '*'
          run: |
            set -e
            report=freebsd-report.txt
            echo "system: $(freebsd-version)" > $report
            echo "rust: $(rustc --version)" >> $report
            cargo test > test.log 2>&1 || { cat test.log; exit 1; }
            grep "test result" test.log | sed 's/^/tests: /' >> $report
            bash tools/package.sh
            cd dist/dgnv8w-*/
            ./dgnv8w build examples/gdal_example.json | head -1 | sed 's/^/example: /' >> ../../$report

      - name: Report what the virtual machine did
        run: |
          test -s freebsd-report.txt
          while IFS= read -r line; do echo "::notice title=FreeBSD::$line"; done < freebsd-report.txt
          for bundle in dist/*.tar.gz; do echo "::notice title=FreeBSD bundle::$bundle"; done

      - uses: actions/upload-artifact@v4
        with:
          name: dgnv8w-freebsd
          path: dist/*.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, bundle-freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bundles/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See docs/HANDOVER.md in the bundle."
