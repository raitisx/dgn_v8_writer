name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (golden bytes + ezdgn read-back)
        run: cargo test

      - name: API documentation builds without warnings
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Traceability (code -> rule -> evidence)
        run: python3 tools/check_trace.py

      - name: Test files are reproducible from their jobs
        run: tools/build_testfiles.sh

      - name: Example job runs
        run: target/release/dgnv8w build examples/gdal_example.json
